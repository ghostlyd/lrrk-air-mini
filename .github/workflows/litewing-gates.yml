name: LiteWing gates

on:
  push:
    paths:
      - "ports/ninjapilot-litewing/**"
      - "ai_assistant/**"
      - "docs/PORT_AND_DEPENDENCIES.md"
      - ".github/workflows/litewing-gates.yml"
  pull_request:
    paths:
      - "ports/ninjapilot-litewing/**"
      - "ai_assistant/**"
      - "docs/PORT_AND_DEPENDENCIES.md"
      - ".github/workflows/litewing-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openai-sdk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional SDK
        run: python -m pip install './ai_assistant[openai]'
      - name: Check installed dependencies
        run: |
          python -m pip check
          python -c 'import agents'
      - name: Test real SDK tool wrappers with network blocked
        run: python -m unittest discover -s ai_assistant/tests -p test_provider_sdk.py -v

  host-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run host and static gates
        run: ports/ninjapilot-litewing/build.sh --host-only

  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch exact external inputs
        shell: bash
        env:
          NINJAPILOT_COMMIT: ac77304a58de6c8bd552f94668b46903adb71cb2
          ESP32_REFERENCE_COMMIT: 7233c97f844c0377930bcdf22998e289638b64c6
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/litewing-external"
          git clone --filter=blob:none https://github.com/MAVProxyUser/NinjaPilot-15.02.ninja.git "$RUNNER_TEMP/litewing-external/NinjaPilot"
          git -C "$RUNNER_TEMP/litewing-external/NinjaPilot" fetch --depth 1 origin "$NINJAPILOT_COMMIT"
          git -C "$RUNNER_TEMP/litewing-external/NinjaPilot" checkout --detach "$NINJAPILOT_COMMIT"
          git clone --filter=blob:none https://github.com/MAVProxyUser/OpenPilotESP32-WROOM-32E.git "$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E"
          git -C "$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E" fetch --depth 1 origin "$ESP32_REFERENCE_COMMIT"
          git -C "$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E" checkout --detach "$ESP32_REFERENCE_COMMIT"
      - name: Verify pinned source gate
        run: |
          python3 ports/ninjapilot-litewing/verify_external_sources.py \
            --manifest ports/ninjapilot-litewing/SOURCE_MANIFEST.json \
            --flight "$RUNNER_TEMP/litewing-external/NinjaPilot" \
            --reference "$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E"
      - name: Check repository patches against pinned source
        run: |
          git -C "$RUNNER_TEMP/litewing-external/NinjaPilot" apply --check \
            "$GITHUB_WORKSPACE/ports/ninjapilot-litewing/patches/litewing-target.patch" \
            "$GITHUB_WORKSPACE/ports/ninjapilot-litewing/patches/simlitewing-loopback.patch"
      - name: Test receiver freshness through the real pinned UAVTalk parser
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p 'test_gcs_*.py' -v
      - name: Test restricted bench probe with pinned protocol definitions
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_receiver_probe.py -v
      - name: Characterize startup counter and monitor integration
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
          LRRK_TEST_REFERENCE_ROOT="$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_startup_runtime.py -v
      - name: Generate real flight objects for control-consumer integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qt5-qmake
          make -C "$RUNNER_TEMP/litewing-external/NinjaPilot" -j2 uavobjects_flight
      - name: Test full control tasks with generated UAVObjects
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p 'test_thrust_*.py' -v
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_input_startup.py -v
      - name: Test board startup failure propagation with generated declarations
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_board_startup.py -v
      - name: Test real startup services and hash-checked preparation
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_startup_services.py -v
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_startup_preparation.py -v
      - name: Test complete scheduler lifecycle and System startup caller
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p 'test_*scheduler*.py' -v
