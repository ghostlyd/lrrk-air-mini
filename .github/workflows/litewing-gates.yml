name: LiteWing gates

on:
  push:
    paths:
      - "ports/ninjapilot-litewing/**"
      - "ai_assistant/**"
      - "docs/PORT_AND_DEPENDENCIES.md"
      - ".github/workflows/litewing-gates.yml"
  pull_request:
    paths:
      - "ports/ninjapilot-litewing/**"
      - "ai_assistant/**"
      - "docs/PORT_AND_DEPENDENCIES.md"
      - ".github/workflows/litewing-gates.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-permission-gate:
    name: audit-permission-gate (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the host package and platform permission backend
        run: python -m pip install ./ai_assistant
      - name: Check installed dependencies
        run: python -m pip check
      - name: Verify the Windows ACL backend
        if: runner.os == 'Windows'
        run: python -c "import oschmod, win32security"
      - name: Test private audit creation and append
        run: python -m unittest discover -s ai_assistant/tests -p test_audit.py -v
      - name: Test private provisioning and simulated operator transport
        if: runner.os != 'Windows'
        run: python -m unittest discover -s ai_assistant/tests -p 'test_provisioning_*.py' -v

  uavtalk-transport-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install live UAVTalk transport extra
        run: python -m pip install './ai_assistant[uavtalk]'
      - name: Check installed transport dependencies
        run: |
          python -m pip check
          python -c 'import serial'
      - name: Test bounded live transport without hardware access
        run: python -m unittest discover -s ai_assistant/tests -p test_live_uavtalk.py -v

  openai-sdk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned optional SDK
        run: python -m pip install './ai_assistant[openai]'
      - name: Check installed dependencies
        run: |
          python -m pip check
          python -c 'import agents'
      - name: Test real SDK tool wrappers with network blocked
        run: python -m unittest discover -s ai_assistant/tests -p test_provider_sdk.py -v

  host-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run host and static gates
        run: ports/ninjapilot-litewing/build.sh --host-only

  pilot-crypto-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned ESP-IDF mbedTLS source
        uses: actions/checkout@v4
        with:
          repository: espressif/mbedtls
          ref: 98fcfd6d2cea90d306e8fde8e5bffd6087c9cda8
          path: .pilot-crypto-input
          persist-credentials: false
      - name: Verify real crypto vectors and bounded codec
        env:
          LRRK_TEST_MBEDTLS_ROOT: ${{ github.workspace }}/.pilot-crypto-input
        run: python -m unittest discover -s ports/ninjapilot-litewing/tests -p 'test_pilot*.py' -v

  wifi-ap-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned ESP-IDF API headers
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: 9d7f2d69f50d1288526d4f1027108e314e8c879f
          path: .pilot-idf-input
          persist-credentials: false
          sparse-checkout: |
            components/esp_wifi/include
            components/esp_event/include
            components/esp_hw_support/include
      - name: Fetch pinned crypto for command-task interoperability
        uses: actions/checkout@v4
        with:
          repository: espressif/mbedtls
          ref: 98fcfd6d2cea90d306e8fde8e5bffd6087c9cda8
          path: .pilot-crypto-input
          persist-credentials: false
      - name: Exercise AP and command lifecycle without optional skips
        env:
          LRRK_TEST_IDF_ROOT: ${{ github.workspace }}/.pilot-idf-input
          LRRK_TEST_MBEDTLS_ROOT: ${{ github.workspace }}/.pilot-crypto-input
        run: |
          python - <<'PY'
          import sys
          import unittest
          suite = unittest.defaultTestLoader.discover(
              'ports/ninjapilot-litewing/tests', pattern='test_wifi*.py')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() and not result.skipped else 1)
          PY

  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch exact external inputs
        shell: bash
        env:
          NINJAPILOT_COMMIT: ac77304a58de6c8bd552f94668b46903adb71cb2
          ESP32_REFERENCE_COMMIT: 7233c97f844c0377930bcdf22998e289638b64c6
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/litewing-external"
          git clone --filter=blob:none https://github.com/MAVProxyUser/NinjaPilot-15.02.ninja.git "$RUNNER_TEMP/litewing-external/NinjaPilot"
          git -C "$RUNNER_TEMP/litewing-external/NinjaPilot" fetch --depth 1 origin "$NINJAPILOT_COMMIT"
          git -C "$RUNNER_TEMP/litewing-external/NinjaPilot" checkout --detach "$NINJAPILOT_COMMIT"
          git clone --filter=blob:none https://github.com/MAVProxyUser/OpenPilotESP32-WROOM-32E.git "$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E"
          git -C "$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E" fetch --depth 1 origin "$ESP32_REFERENCE_COMMIT"
          git -C "$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E" checkout --detach "$ESP32_REFERENCE_COMMIT"
      - name: Verify pinned source gate
        run: |
          python3 ports/ninjapilot-litewing/verify_external_sources.py \
            --manifest ports/ninjapilot-litewing/SOURCE_MANIFEST.json \
            --flight "$RUNNER_TEMP/litewing-external/NinjaPilot" \
            --reference "$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E"
      - name: Check repository patches against pinned source
        run: |
          git -C "$RUNNER_TEMP/litewing-external/NinjaPilot" apply --check \
            "$GITHUB_WORKSPACE/ports/ninjapilot-litewing/patches/litewing-target.patch" \
            "$GITHUB_WORKSPACE/ports/ninjapilot-litewing/patches/simlitewing-loopback.patch"
      - name: Build pinned IMU generator with Qt5 Core and XML
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential qtbase5-dev qt5-qmake
          upstream="$RUNNER_TEMP/litewing-external/NinjaPilot"
          output="$(mktemp -d "$RUNNER_TEMP/litewing-imu.XXXXXX")"
          # Tests resolve templates from generator.parents[2]. Preserve that layout
          # in temporary output without building or editing the pinned source tree.
          mkdir -p "$output/ground/uavobjgenerator" "$output/existing"
          ln -s "$upstream/flight" "$output/flight"
          cd "$output/ground/uavobjgenerator"
          export QT_SELECT=qt5
          [[ "$(qmake -query QT_VERSION)" == 5.* ]]
          qmake "$upstream/ground/uavobjgenerator/uavobjgenerator.pro" 'QT=core xml'
          make -j2
          generator="$PWD/uavobjgenerator"
          test -x "$generator"
          # The pinned commit has no checked-in build/uavobject-synthetics/flight.
          # Generate the full pinned object corpus for the collision check.
          cd "$output/existing"
          "$generator" -flight "$upstream/shared/uavobjectdefinition" "$upstream"
          test -s "$output/existing/flight/attitudestate.h"
          echo "LW_IMU_GENERATOR=$generator" >> "$GITHUB_ENV"
          echo "LW_IMU_EXISTING_HEADERS=$output/existing/flight" >> "$GITHUB_ENV"
      - name: Test generated IMU schema publication and host C-byte interoperability without skips
        shell: bash
        env:
          PYTHONPATH: ai_assistant/src:ai_assistant/tests:ports/ninjapilot-litewing/tests
          LRRK_TEST_FLIGHT_ROOT: ${{ runner.temp }}/litewing-external/NinjaPilot
        run: |
          python3 - <<'PY'
          import unittest
          suite = unittest.defaultTestLoader.loadTestsFromNames([
              'test_imu_health', 'test_imu_publication', 'test_uavobjects',
              'test_imu_header_isolation'])
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print('IMU CI gate rejects skipped tests:', result.skipped)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun and not result.skipped else 1)
          PY
      - name: Test receiver freshness through the real pinned UAVTalk parser
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p 'test_gcs_*.py' -v
      - name: Test complete host frames through parser worker and scoped store
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_usb_parser_store.py -v
      - name: Test zero-wait telemetry reads with the pinned object packer
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_telemetry_objects.py -v
      - name: Test restricted bench probe with pinned protocol definitions
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_receiver_probe.py -v
      - name: Characterize startup counter and monitor integration
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
          LRRK_TEST_REFERENCE_ROOT="$RUNNER_TEMP/litewing-external/OpenPilotESP32-WROOM-32E" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_startup_runtime.py -v
      - name: Generate real flight objects for control-consumer integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qt5-qmake
          make -C "$RUNNER_TEMP/litewing-external/NinjaPilot" -j2 uavobjects_flight
      - name: Test full control tasks with generated UAVObjects
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p 'test_thrust_*.py' -v
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_input_startup.py -v
      - name: Test board startup failure propagation with generated declarations
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_board_startup.py -v
      - name: Test checked Stabilization lifecycle with sanitizers and pinned source
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_outerloop_bounds.py -v
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_innerloop_startup.py -v
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_stabilization_startup.py -v
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_stabilization_preparation.py -v
      - name: Test real startup services and hash-checked preparation
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_startup_services.py -v
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p test_startup_preparation.py -v
      - name: Test complete scheduler lifecycle and System startup caller
        run: |
          LRRK_TEST_FLIGHT_ROOT="$RUNNER_TEMP/litewing-external/NinjaPilot" \
            python3 -m unittest discover -s ports/ninjapilot-litewing/tests -p 'test_*scheduler*.py' -v
