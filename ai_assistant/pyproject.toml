[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrrk-litewing-ai"
version = "0.2.0"
description = "Offline-first, host-only advisory assistant for LiteWing telemetry"
requires-python = ">=3.11,<3.15"
dependencies = [
  "oschmod==0.3.12; sys_platform == 'win32'",
  "pywin32==312; sys_platform == 'win32'",
]
classifiers = [
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
uavtalk = ["pyserial>=3.5,<4"]
crazyflie = ["cflib>=0.1.26,<1"]
openai = ["openai-agents==0.22.1"]

[project.scripts]
litewing-ai = "lrrk_litewing_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
