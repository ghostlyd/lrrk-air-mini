[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lrrk-litewing-ai"
version = "0.1.0"
description = "Offline-first, host-only advisory assistant for LiteWing telemetry"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
uavtalk = ["cflib>=0.1.26,<1"]
openai = ["openai-agents==0.22.1"]

[project.scripts]
litewing-ai = "lrrk_litewing_ai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
